<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>AI Playground</title>

<style>

:root {{
    --bg: #07090d;
    --panel: rgba(18,22,30,.82);
    --panel2: rgba(24,29,39,.82);
    --border: rgba(255,255,255,.09);
    --text: #f5f7fb;
    --muted: #8e98aa;
    --accent: #7c8cff;
    --accent2: #9c7cff;
    --danger: #ff657a;
    --shadow: 0 25px 80px rgba(0,0,0,.42);
}}

* {{
    box-sizing:border-box;
}}

html,body {{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(124,140,255,.13),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(156,124,255,.10),
            transparent 35%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}}

button,
input,
textarea,
select {{
    font:inherit;
}}

button {{
    cursor:pointer;
}}

#app {{
    height:100vh;
    display:flex;
    flex-direction:column;
}}

header {{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid var(--border);
    background:rgba(7,9,13,.72);
    backdrop-filter:blur(24px);
    z-index:10;
}}

.brand {{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    letter-spacing:-.4px;
}}

.logo {{
    width:36px;
    height:36px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
    box-shadow:0 8px 30px rgba(124,140,255,.25);
}}

.header-actions {{
    display:flex;
    gap:8px;
}}

.icon-btn {{
    border:1px solid var(--border);
    background:rgba(255,255,255,.045);
    color:var(--text);
    width:40px;
    height:40px;
    border-radius:12px;
    transition:.2s;
}}

.icon-btn:hover {{
    background:rgba(255,255,255,.09);
    transform:translateY(-1px);
}}

main {{
    flex:1;
    min-height:0;
    display:flex;
}}

.sidebar {{
    width:240px;
    border-right:1px solid var(--border);
    padding:18px 12px;
    overflow:auto;
    background:rgba(8,10,15,.52);
}}

.category {{
    width:100%;
    border:0;
    background:transparent;
    color:var(--muted);
    text-align:left;
    padding:10px 12px;
    border-radius:10px;
    margin-bottom:4px;
    transition:.2s;
}}

.category:hover {{
    color:var(--text);
    background:rgba(255,255,255,.045);
}}

.category.active {{
    color:var(--text);
    background:
        linear-gradient(
            90deg,
            rgba(124,140,255,.16),
            rgba(124,140,255,.04)
        );
}}

.content {{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}}

.toolbar {{
    padding:18px;
    display:flex;
    gap:12px;
    align-items:center;
}}

.search {{
    flex:1;
    height:48px;
    border-radius:14px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.045);
    color:var(--text);
    padding:0 16px;
    outline:none;
    transition:.2s;
}}

.search:focus {{
    border-color:rgba(124,140,255,.5);
    box-shadow:0 0 0 4px rgba(124,140,255,.08);
}}

.status {{
    display:flex;
    align-items:center;
    gap:8px;
    height:48px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--muted);
    font-size:13px;
}}

.dot {{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#666;
}}

.dot.online {{
    background:#54e38e;
    box-shadow:0 0 12px rgba(84,227,142,.6);
}}

.grid {{
    flex:1;
    min-height:0;
    overflow:auto;
    padding:0 18px 24px;
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(220px,1fr));
    gap:12px;
    align-content:start;
}}

.card {{
    min-height:130px;
    padding:17px;
    border:1px solid var(--border);
    border-radius:17px;
    background:var(--panel);
    box-shadow:var(--shadow);
    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease;
}}

.card:hover {{
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.15);
    background:var(--panel2);
}}

.card-top {{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}}

.card-icon {{
    width:38px;
    height:38px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:rgba(124,140,255,.12);
    color:#aeb8ff;
}}

.card h3 {{
    margin:13px 0 5px;
    font-size:15px;
}}

.card p {{
    margin:0;
    color:var(--muted);
    line-height:1.45;
    font-size:12px;
}}

.launch {{
    margin-top:15px;
    width:100%;
    height:34px;
    border-radius:9px;
    border:1px solid rgba(124,140,255,.25);
    color:white;
    background:rgba(124,140,255,.12);
    transition:.2s;
}}

.launch:hover {{
    background:rgba(124,140,255,.22);
}}

.workspace {{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
}}

.widget-window {{
    position:absolute;
    width:min(560px,calc(100vw - 30px));
    max-height:calc(100vh - 30px);
    overflow:auto;
    pointer-events:auto;
    background:
        linear-gradient(
            145deg,
            rgba(25,30,41,.97),
            rgba(12,15,22,.97)
        );
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    box-shadow:0 35px 100px rgba(0,0,0,.6);
    padding:18px;
    animation:pop .22s ease;
}}

@keyframes pop {{
    from {{
        opacity:0;
        transform:scale(.97) translateY(8px);
    }}
    to {{
        opacity:1;
        transform:none;
    }}
}}

.window-head {{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}}

.window-title {{
    font-weight:750;
}}

.close {{
    width:34px;
    height:34px;
    border:1px solid var(--border);
    border-radius:9px;
    background:rgba(255,255,255,.05);
    color:white;
}}

.tool-input {{
    width:100%;
    min-height:44px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(0,0,0,.2);
    color:white;
    padding:11px;
    outline:none;
    margin-bottom:10px;
}}

.tool-button {{
    min-height:42px;
    padding:0 15px;
    border:0;
    border-radius:11px;
    background:linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );
    color:white;
    font-weight:700;
}}

.result {{
    margin-top:12px;
    padding:13px;
    border-radius:11px;
    background:rgba(255,255,255,.045);
    color:#dce2ee;
    white-space:pre-wrap;
}}

.toast {{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(15px);
    opacity:0;
    pointer-events:none;
    z-index:100;
    padding:11px 15px;
    border-radius:12px;
    background:#161b25;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    transition:.25s;
}}

.toast.show {{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}}

.empty {{
    grid-column:1/-1;
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
}}

@media(max-width:800px) {{
    .sidebar {{
        width:190px;
    }}
}}

@media(max-width:620px) {{
    .sidebar {{
        display:none;
    }}

    header {{
        padding:0 14px;
    }}

    .toolbar {{
        padding:12px;
    }}

    .grid {{
        padding:0 12px 18px;
    }}
}}

</style>
</head>

<body>

<div id="app">

<header>

    <div class="brand">
        <div class="logo">✦</div>
        <div>AI Playground</div>
    </div>

    <div class="header-actions">
        <button
            class="icon-btn"
            id="bridgeBtn"
            title="Check AI bridge"
        >⌁</button>

        <button
            class="icon-btn"
            id="settingsBtn"
            title="Settings"
        >⚙</button>
    </div>

</header>

<main>

    <aside class="sidebar" id="sidebar"></aside>

    <section class="content">

        <div class="toolbar">

            <input
                id="search"
                class="search"
                placeholder="Search widgets or type a command..."
                autocomplete="off"
            >

            <div class="status">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Bridge offline</span>
            </div>

        </div>

        <div
            id="grid"
            class="grid"
        ></div>

    </section>

</main>

</div>

<div
    id="workspace"
    class="workspace"
></div>

<div
    id="toast"
    class="toast"
></div>

<script>

umber_guess", "name": "Number Guess", "description": "Guess the number", "category": "Games"}, {"id": "ai_chat", "name": "AI Chat", "description": "Chat with the AI", "category": "AI"}, {"id": "ai_summarizer", "name": "AI Summarizer", "description": "Summarize text", "category": "AI"}, {"id": "ai_writer", "name": "AI Writer", "description": "Generate writing", "category": "AI"}, {"id": "ai_brainstorm", "name": "AI Brainstorm", "description": "Brainstorm ideas", "category": "AI"}, {"id": "ai_explainer", "name": "AI Explainer", "description": "Explain concepts", "category": "AI"}, {"id": "browser_info", "name": "Browser Information", "description": "View browser information", "category": "System"}, {"id": "screen_info", "name": "Screen Information", "description": "View screen information", "category": "System"}, {"id": "fullscreen", "name": "Fullscreen", "description": "Toggle fullscreen", "category": "System"}, {"id": "online_status", "name": "Connection Status", "description": "Check connection", "category": "System"}, {"id": "bridge_status", "name": "Bridge Status", "description": "Check local AI bridge", "category": "System"}, {"id": "invoice", "name": "Invoice Builder", "description": "Build invoices", "category": "Business"}, {"id": "tax", "name": "Tax Calculator", "description": "Calculate taxes", "category": "Business"}, {"id": "tip", "name": "Tip Calculator", "description": "Calculate tips", "category": "Business"}, {"id": "loan", "name": "Loan Calculator", "description": "Calculate loans", "category": "Business"}, {"id": "profit", "name": "Profit Calculator", "description": "Calculate profit", "category": "Business"}];

const BRIDGE =
    localStorage.getItem("ai_playground_bridge")
    || "http://127.0.0.1:8765";

let currentCategory = "All";

const workspace =
    document.getElementById("workspace");

const grid =
    document.getElementById("grid");

const sidebar =
    document.getElementById("sidebar");

const search =
    document.getElementById("search");

const toast =
    document.getElementById("toast");

function showToast(message) {{

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(
        () => toast.classList.remove("show"),
        2200
    );
}}

function iconFor(category) {{

    const icons = {{
        Math:"∑",
        Productivity:"✓",
        Converters:"↔",
        Developer:"<>",
        Web:"⌁",
        Microsoft:"▦",
        Creative:"✦",
        Data:"▤",
        Education:"◇",
        Travel:"⌖",
        Media:"▶",
        Games:"♟",
        AI:"✧",
        System:"⚙",
        Business:"$"
    }};

    return icons[category] || "•";
}}

function buildSidebar() {{

    const categories = [
        "All",
        ...new Set(
            WIDGETS.map(x => x.category)
        )
    ];

    sidebar.innerHTML = categories.map(
        category => `
            <button
                class="category ${{category === currentCategory ? "active" : ""}}"
                data-category="${{category}}"
            >
                ${{category}}
            </button>
        `
    ).join("");

    sidebar
        .querySelectorAll(".category")
        .forEach(button => {{

            button.addEventListener(
                "click",
                () => {{

                    currentCategory =
                        button.dataset.category;

                    buildSidebar();
                    render();

                }}
            );

        }});
}}

function render() {{

    const query =
        search.value.trim().toLowerCase();

    const filtered =
        WIDGETS.filter(widget => {{

            const categoryMatch =
                currentCategory === "All"
                || widget.category === currentCategory;

            const text =
                (
                    widget.name
                    + " "
                    + widget.description
                    + " "
                    + widget.category
                ).toLowerCase();

            return categoryMatch
                && text.includes(query);
        }});

    if (!filtered.length) {{

        grid.innerHTML = `
            <div class="empty">
                No widgets found.
            </div>
        `;

        return;
    }}

    grid.innerHTML = filtered.map(widget => `

        <article class="card">

            <div class="card-top">

                <div class="card-icon">
                    ${{iconFor(widget.category)}}
                </div>

            </div>

            <h3>${{widget.name}}</h3>

            <p>${{widget.description}}</p>

            <button
                class="launch"
                data-widget="${{widget.id}}"
            >
                Open
            </button>

        </article>

    `).join("");

    grid
        .querySelectorAll(".launch")
        .forEach(button => {{

            button.addEventListener(
                "click",
                () => openWidget(button.dataset.widget)
            );

        }});
}}

function centerWindow(windowElement) {{

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    const rect =
        windowElement.getBoundingClientRect();

    windowElement.style.left =
        Math.max(
            15,
            (width - rect.width) / 2
        ) + "px";

    windowElement.style.top =
        Math.max(
            15,
            (height - rect.height) / 2
        ) + "px";
}}

function openWidget(id) {{

    const widget =
        WIDGETS.find(x => x.id === id);

    if (!widget) return;

    const win =
        document.createElement("div");

    win.className =
        "widget-window";

    win.innerHTML = `

        <div class="window-head">

            <div class="window-title">
                ${{widget.name}}
            </div>

            <button class="close">
                ×
            </button>

        </div>

        <div class="widget-body"></div>

    `;

    workspace.appendChild(win);

    win.querySelector(".close")
        .onclick = () => win.remove();

    const body =
        win.querySelector(".widget-body");

    buildWidgetBody(
        id,
        body,
        win
    );

    requestAnimationFrame(
        () => centerWindow(win)
    );
}}

function widgetTitle(id) {{

    const widget =
        WIDGETS.find(x => x.id === id);

    return widget
        ? escapeHtml(widget.name)
        : "Widget";
}}

function formatStopwatch(ms) {{

    const total =
        Math.floor(ms);

    const minutes =
        Math.floor(total / 60000);

    const seconds =
        Math.floor(
            (total % 60000) / 1000
        );

    const millis =
        total % 1000;

    return (
        String(minutes).padStart(2,"0")
        + ":"
        + String(seconds).padStart(2,"0")
        + "."
        + String(millis).padStart(3,"0")
    );
}}

function escapeHtml(value) {{

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}}

async function sendNaturalCommand(command) {{

    if (!command.trim()) return;

    try {{

        const response =
            await fetch(
                BRIDGE + "/command",
                {{
                    method:"POST",
                    headers:{{
                        "Content-Type":
                            "application/json"
                    }},
                    body:JSON.stringify({{
                        command
                    }})
                }}
            );

        const data =
            await response.json();

        if (data.widget) {{

            openWidget(data.widget);

            showToast(
                data.message
                || "Opening widget."
            );

            return;
        }}

        if (data.text) {{

            const win =
                document.createElement("div");

            win.className =
                "widget-window";

            win.innerHTML = `

                <div class="window-head">

                    <div class="window-title">
                        AI Response
                    </div>

                    <button class="close">
                        ×
                    </button>

                </div>

                <div class="result">
                    ${{escapeHtml(data.text)}}
                </div>
            `;

            workspace.appendChild(win);

            win.querySelector(".close")
                .onclick = () => win.remove();

            requestAnimationFrame(
                () => centerWindow(win)
            );

            return;
        }

        showToast(
            data.error
            || "No result."
        );

    }} catch(e) {{

        showToast(
            "AI bridge is offline."
        );
    }}
}}

search.addEventListener(
    "keydown",
    event => {{

        if (
            event.key === "Enter"
            && search.value.trim()
        ) {{

            const command =
                search.value.trim();

            const direct =
                WIDGETS.find(
                    x =>
                        x.name.toLowerCase()
                        === command.toLowerCase()
                );

            if (direct) {{

                openWidget(direct.id);

            }} else {{

                sendNaturalCommand(command);
            }}

        }}

        if (event.key === "Escape") {{
            search.value = "";
            render();
        }}
    }}
);

search.addEventListener(
    "input",
    render
);

document.getElementById(
    "bridgeBtn"
).onclick = async () => {{

    try {{

        const response =
            await fetch(
                BRIDGE + "/health"
            );

        const data =
            await response.json();

        document.getElementById(
            "statusDot"
        ).classList.add("online");

        document.getElementById(
            "statusText"
        ).textContent =
            "Bridge online";

        showToast(
            "AI bridge connected"
        );

    }} catch(e) {{

        document.getElementById(
            "statusDot"
        ).classList.remove("online");

        document.getElementById(
            "statusText"
        ).textContent =
            "Bridge offline";

        showToast(
            "AI bridge unavailable"
        );
    }}
}};

document.getElementById(
    "settingsBtn"
).onclick = () => {{

    const win =
        document.createElement("div");

    win.className =
        "widget-window";

    win.innerHTML = `

        <div class="window-head">

            <div class="window-title">
                Settings
            </div>

            <button class="close">
                ×
            </button>

        </div>

        <label style="font-size:12px;color:#8e98aa">
            Local AI Bridge
        </label>

        <input
            id="bridgeInput"
            class="tool-input"
            value="${{escapeHtml(BRIDGE)}}"
        >

        <button
            id="saveBridge"
            class="tool-button"
        >
            Save
        </button>

        <div class="result">
            The API key is intentionally not stored
            in the public frontend.
        </div>
    `;

    workspace.appendChild(win);

    win.querySelector(".close")
        .onclick = () => win.remove();

    win.querySelector("#saveBridge")
        .onclick = () => {{

            const value =
                win.querySelector(
                    "#bridgeInput"
                ).value.trim();

            if (!value) return;

            localStorage.setItem(
                "ai_playground_bridge",
                value
            );

            showToast(
                "Bridge URL saved"
            );

            win.remove();
        }};

    requestAnimationFrame(
        () => centerWindow(win)
    );
}};

buildSidebar();
render();

</script>

</body>
</html>
